ServerName localhost

# Disable default charset override (CGI scripts set their own charset via headers)
AddDefaultCharset Off

# UTF-8 I/O for Perl CGI (suppresses "Wide character in print" warnings)
SetEnv PERL_UNICODE SDAL

<Directory "/var/www/html/cgi3">
    Options +ExecCGI
    AddHandler cgi-script .cgi .pl
    Require all granted
</Directory>
